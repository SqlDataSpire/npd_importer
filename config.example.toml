# Copy to C:\npd-loader\config.toml. Connections live in the DataEngine env file named below (Windows auth, no
# passwords). Use database.dev.env for development and database.prd.env for production.

[source]
manifest_url = "https://directory.cms.gov/downloads/manifest.json"

[storage]
backend = "local"
root = 'D:\npd'

[databases]
env_file = 'C:\npd-loader\database.prd.env'

[npd_db]
connection = "data"           # must be a type "mssql" connection (SQL Server only)
stage_schema = "npd_stage"    # fixed staging tables, truncated at the start of each import
schema = "npd"
flatten_workers = 4           # .ndjson files flattened in parallel (Python processes)
bcp_workers = 8               # bcp loads running in parallel
lock_timeout_seconds = 30     # the delta apply gives up waiting for a table lock after this (3 attempts)

[catalog]
connection = "catalog"
run_table = "dbo.MASTER_WAREHOUSE_RUN"
file_table = "dbo.DATA_FILE"
project = "NPD"
run_type = "National Provider Directory"
file_set = "NPD_FHIR"

[download]
max_attempts = 8
backoff_seconds = 5
timeout_seconds = 60

[retention]
# Extracted .ndjson files of the newest N releases are kept; older ones are deleted. The .ndjson.zst originals are
# always kept (they are the backup). The data itself is one current dataset.
keep_releases = 1
